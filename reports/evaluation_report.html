<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediDesk Evaluation</title>
<style>
:root {
  color-scheme: light;
  --bg:#f4f4f1; --surface:#fcfcfb; --raised:#ffffff; --line:#e4e3de; --grid:#ecebe7; --hover:#f0efeb;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7974;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ref:#a3a29b;
  --good:#0ca30c; --good-ink:#006300; --good-bg:#e5f4e5;
  --critical:#d03b3b; --critical-ink:#a32020; --critical-bg:#fbe7e7;
  --serious:#ec835a; --serious-ink:#9a3d12; --serious-bg:#fcebe2;
  --warning:#fab219; --warning-ink:#7a5200; --warning-bg:#fdf3dc;
  --neutral-ink:#52514e; --neutral-bg:#ecebe7;
  --sample:#7a3fc1; --sample-bg:#f1e9fb;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --raised:#222220; --line:#33332f; --grid:#2a2a27; --hover:#262624;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#9a9990;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ref:#6b6a64;
    --good-ink:#5fd35f; --good-bg:#16301a;
    --critical-ink:#f08a8a; --critical-bg:#3a1b1b;
    --serious-ink:#f3a483; --serious-bg:#3b2318;
    --warning-ink:#fab219; --warning-bg:#3a2e12;
    --neutral-ink:#c3c2b7; --neutral-bg:#2c2c29;
    --sample:#c09cf0; --sample-bg:#2c2140;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --raised:#222220; --line:#33332f; --grid:#2a2a27; --hover:#262624;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#9a9990;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ref:#6b6a64;
  --good-ink:#5fd35f; --good-bg:#16301a;
  --critical-ink:#f08a8a; --critical-bg:#3a1b1b;
  --serious-ink:#f3a483; --serious-bg:#3b2318;
  --warning-ink:#fab219; --warning-bg:#3a2e12;
  --neutral-ink:#c3c2b7; --neutral-bg:#2c2c29;
  --sample:#c09cf0; --sample-bg:#2c2140;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
button { font:inherit; color:inherit; }
a { color:var(--s1); }
code, .mono { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }

/* ---------- shell ---------- */
.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.top-inner { max-width:1280px; margin:0 auto; padding:14px 16px 0; }
.title-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { font-size:19px; margin:0; letter-spacing:-.01em; }
.meta { color:var(--muted); font-size:12.5px; margin-top:2px; }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); }
.seg button { border:0; background:transparent; padding:5px 12px; cursor:pointer; font-size:13px; }
.seg button[aria-pressed="true"] { background:var(--text); color:var(--bg); }
.tabs { display:flex; gap:2px; overflow-x:auto; margin-top:10px; scrollbar-width:thin; }
.tab { border:0; background:transparent; padding:9px 12px 10px; cursor:pointer; color:var(--text-2); border-bottom:2px solid transparent; white-space:nowrap; display:flex; gap:7px; align-items:center; font-size:13.5px; }
.tab:hover { color:var(--text); }
.tab[aria-selected="true"] { color:var(--text); border-bottom-color:var(--text); font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.dot.pass { background:var(--good); } .dot.fail { background:var(--critical); } .dot.warn { background:var(--warning); }
.dot.missing { background:transparent; border:1.5px dashed var(--muted); }
.badge { font-size:11px; font-weight:700; border-radius:99px; padding:0 6px; background:var(--critical-bg); color:var(--critical-ink); }
.badge.warn { background:var(--warning-bg); color:var(--warning-ink); }
main { max-width:1280px; margin:0 auto; padding:20px 16px 64px; display:flex; flex-direction:column; gap:16px; }
.sample-banner { background:var(--sample-bg); color:var(--sample); border-radius:10px; padding:9px 14px; font-weight:600; font-size:13px; display:flex; gap:8px; align-items:center; }

/* ---------- panels ---------- */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-width:0; }
.panel-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
h2 { font-size:15px; margin:0; }
.panel-h p { margin:2px 0 0; color:var(--text-2); font-size:13px; }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr)); }
.g-main { grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); }
@media (max-width:900px) { .g-main { grid-template-columns:1fr; } }

/* ---------- verdict + kpis ---------- */
.verdict { display:flex; gap:16px; align-items:center; flex-wrap:wrap; border-radius:12px; padding:16px 18px; }
.verdict.fail { background:var(--critical-bg); }
.verdict.pass { background:var(--good-bg); }
.verdict .big { font-size:22px; font-weight:700; letter-spacing:-.01em; }
.verdict.fail .big { color:var(--critical-ink); } .verdict.pass .big { color:var(--good-ink); }
.verdict .why { color:var(--text-2); }
.verdict .meter-wrap { margin-left:auto; min-width:220px; }
.meter { height:8px; background:var(--grid); border-radius:99px; overflow:hidden; display:flex; gap:2px; }
.meter span { display:block; height:100%; }
.meter .m-pass { background:var(--good); } .meter .m-fail { background:var(--critical); } .meter .m-missing { background:var(--line); }
.meter-cap { font-size:12px; color:var(--text-2); margin-top:4px; display:flex; justify-content:space-between; gap:12px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.kpi { text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; }
.kpi:hover { border-color:var(--muted); }
.kpi .k { color:var(--text-2); font-size:12.5px; }
.kpi .v { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin:2px 0; }
.kpi .d { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; }

/* ---------- status ---------- */
.pill { display:inline-flex; gap:5px; align-items:center; padding:1px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
.pill.pass, .pill.good { color:var(--good-ink); background:var(--good-bg); }
.pill.fail, .pill.critical { color:var(--critical-ink); background:var(--critical-bg); }
.pill.high { color:var(--serious-ink); background:var(--serious-bg); }
.pill.warn, .pill.warning { color:var(--warning-ink); background:var(--warning-bg); }
.pill.missing, .pill.blocking, .pill.info { color:var(--neutral-ink); background:var(--neutral-bg); }
.ico-pass { color:var(--good-ink); } .ico-fail { color:var(--critical-ink); } .ico-warn { color:var(--warning-ink); }
.chip { display:inline-block; font-size:11.5px; padding:0 7px; border-radius:6px; background:var(--neutral-bg); color:var(--neutral-ink); margin:2px 4px 0 0; }
button.chip { border:0; cursor:pointer; }

/* ---------- attention list ---------- */
.issues { display:flex; flex-direction:column; gap:10px; }
.issue { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--raised); }
.issue.critical { border-left-color:var(--critical); } .issue.high { border-left-color:var(--serious); }
.issue.warning { border-left-color:var(--warning); } .issue.blocking { border-left-color:var(--muted); border-left-style:dashed; }
.issue-h { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.issue-t { font-weight:600; }
.issue-lane { color:var(--muted); font-size:12px; margin-left:auto; }
.issue p { margin:5px 0 0; color:var(--text-2); font-size:13px; }
.issue .act { color:var(--text); }
.issue-foot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
.btn { border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:3px 10px; cursor:pointer; font-size:12.5px; }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
.empty { color:var(--muted); padding:14px 0; }
.allclear { background:var(--good-bg); color:var(--good-ink); border-radius:10px; padding:12px 14px; font-weight:600; }

/* ---------- tables ---------- */
.tablewrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; white-space:nowrap; }
tbody tr:last-child td { border-bottom:0; }
tbody tr.click { cursor:pointer; }
tbody tr.click:hover, tbody tr.click:focus-visible { background:var(--hover); outline:none; }
tbody tr.hl { background:var(--warning-bg); }
td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
td.strong { font-weight:600; }
td.muted { color:var(--muted); }
td.clip { max-width:360px; }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.toolbar input { border:1px solid var(--line); background:var(--raised); color:var(--text); border-radius:7px; padding:5px 10px; min-width:200px; font:inherit; font-size:13px; }
.count { color:var(--muted); font-size:12.5px; margin-left:auto; }

/* ---------- charts ---------- */
svg { width:100%; height:auto; display:block; overflow:visible; }
svg text { font-family:inherit; }
.ax { fill:var(--text-2); font-size:12px; }
.ax-m { fill:var(--muted); font-size:11px; }
.vl { fill:var(--text); font-size:12px; font-variant-numeric:tabular-nums; }
.gridline { stroke:var(--grid); stroke-width:1; }
.baseline { stroke:var(--line); stroke-width:1; }
.thr { stroke:var(--text-2); stroke-width:1.5; stroke-dasharray:4 3; }
.f-pass { fill:var(--good); } .f-fail { fill:var(--critical); } .f-warn { fill:var(--warning); } .f-missing { fill:none; stroke:var(--muted); stroke-dasharray:3 3; }
.f-s1 { fill:var(--s1); } .f-s2 { fill:var(--s2); } .f-s3 { fill:var(--s3); } .f-ref { fill:var(--ref); }
.st-ref { stroke:var(--ref); }
.hit { cursor:pointer; outline:none; }
.hit:hover > :not(.ha), .hit:focus-visible > :not(.ha) { opacity:.8; }
.ha { fill:transparent; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-2); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }

/* ---------- rbac matrix + heat grid ---------- */
.matrix td, .matrix th { text-align:center; }
.matrix td:first-child, .matrix th:first-child { text-align:left; }
.cell { display:inline-flex; gap:5px; align-items:center; justify-content:center; min-width:64px; padding:3px 8px; border-radius:7px; font-variant-numeric:tabular-nums; font-weight:600; cursor:pointer; border:0; }
.cell.pass { background:var(--good-bg); color:var(--good-ink); }
.cell.fail { background:var(--critical-bg); color:var(--critical-ink); }
.cell.none { background:transparent; color:var(--muted); cursor:default; }

/* ---------- rules ---------- */
.rules { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:8px; }
.rule { text-align:left; border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); background:var(--raised); cursor:pointer; }
.rule:hover { border-color:var(--muted); }
.rule.pass { background:var(--good-bg); border-color:transparent; }
.rule.fail { background:var(--critical-bg); border-color:transparent; }
.rule.warn { background:var(--warning-bg); border-color:transparent; }
.rule.missing { border-style:dashed; }
.rule .rid { font-weight:650; font-size:12.5px; }
.rule.pass .rid { color:var(--good-ink); } .rule.fail .rid { color:var(--critical-ink); } .rule.warn .rid { color:var(--warning-ink); } .rule.missing .rid { color:var(--muted); }
.rule .rn { font-size:12.5px; } .rule .rl { font-size:11.5px; color:var(--muted); }

/* ---------- lane header + empty ---------- */
.lane-head { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.lane-head .stat { display:flex; flex-direction:column; }
.lane-head .stat b { font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.lane-head .stat span { font-size:12px; color:var(--muted); }
.lane-head .cmd { margin-left:auto; }
.notrun { text-align:center; padding:36px 16px; }
.notrun h2 { font-size:17px; }
.notrun p { color:var(--text-2); max-width:560px; margin:8px auto 14px; }
.callout { border-radius:10px; padding:10px 14px; font-size:13px; }
.callout.warn { background:var(--warning-bg); color:var(--warning-ink); }
.callout.good { background:var(--good-bg); color:var(--good-ink); font-weight:600; }
.callout.fail { background:var(--critical-bg); color:var(--critical-ink); }
.callout.info { background:var(--neutral-bg); color:var(--text-2); }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; }

/* ---------- drawer ---------- */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:20; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); background:var(--surface); border-left:1px solid var(--line); z-index:21; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.18); }
.drawer-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
.drawer-h h2 { font-size:16px; }
.drawer-b { padding:16px 18px 32px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
.drawer .sec h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 6px; }
.quote { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
mark { background:var(--critical-bg); color:var(--critical-ink); border-radius:3px; padding:0 2px; }
.scorebar { display:grid; grid-template-columns:130px 1fr 52px; gap:10px; align-items:center; font-size:13px; margin-bottom:6px; }
.x { border:0; background:transparent; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; }

#tip { position:fixed; pointer-events:none; z-index:30; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:7px 10px; box-shadow:0 6px 20px rgba(0,0,0,.14); font-size:12.5px; display:none; max-width:280px; }
#tip b { display:block; font-size:14px; font-variant-numeric:tabular-nums; }
#tip span { color:var(--text-2); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- about this evaluation ---------- */
.about { padding:0; }
.about summary { list-style:none; cursor:pointer; padding:13px 18px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
.about summary::-webkit-details-marker { display:none; }
.about summary::before { content:"▸"; color:var(--muted); font-size:12px; transition:transform .15s; }
.about[open] summary::before { transform:rotate(90deg); }
.about-k { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
.about-g { font-weight:600; font-size:14.5px; flex:1 1 320px; }
.about-b { padding:0 18px 16px; }
.about-how { color:var(--text-2); margin:0 0 12px; font-size:13px; max-width:900px; }
.about-t td { font-size:13px; }
.bands { min-width:280px; }
.band { display:grid; grid-template-columns:10px max-content 1fr; gap:8px; align-items:baseline; margin-bottom:3px; }
.band b { white-space:nowrap; }
.band span:last-child { color:var(--text-2); }
.band-note { color:var(--text-2); margin-bottom:3px; }
.limit { color:var(--text-2); font-size:13px; margin:8px 0 0; }
:focus-visible { outline:2px solid var(--s1); outline-offset:2px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="title-row">

</header>
<main id="main"></main>

  function viewRegression() {
    var rep = report("regression");
    if (!rep) return [notRun("regression", "Compares this run's lane reports with the frozen v1 baseline: quality may drop at most 0.02 per metric, security / RBAC / trajectory may not change, and at most 10% of quality cases may regress.")];
    var th = D().thresholds;
    var regressed = rep.verdict === "Regressed";
    var out = [sampleBanner(), h("section", { class: "panel" }, [h("div", { class: "lane-head" }, [
      pill(regressed ? "fail" : "pass", rep.verdict),
      h("div", { class: "stat" }, [h("b", { text: rep.baseline.version + " → " + rep.candidate.version }), h("span", { text: rep.change })]),
      h("div", { class: "cmd" }, [h("code", { text: D().commands.regression })])
    ])])];

    var qm = rep.metrics.filter(function (m) { return m.lane === "quality"; });
    var lo = Math.min.apply(null, qm.map(function (m) { return Math.min(m.baseline, m.candidate); }).concat([0.9]));
    lo = Math.floor(lo * 20) / 20;
    out.push(h("div", { class: "grid g2" }, [
      panel("Quality: baseline → candidate", "Grey dot is v1, coloured dot is v2. A drop larger than " + Math.abs(th.regression_delta) + " fails.", [
        dotPlot(qm.map(function (m) {
          return { label: m.metric.replace(/_/g, " "), from: m.baseline, value: m.candidate, status: m.status === "PASS" ? "pass" : "fail", valueLabel: fmt(m.candidate) + " (" + (m.delta >= 0 ? "+" : "") + fmt(m.delta) + ")", tipValue: fmt(m.baseline) + " → " + fmt(m.candidate) + " (Δ " + fmt(m.delta) + ")" };
        }), { min: lo, max: 1.0, ticks: [lo, (lo + 1) / 2, 1.0].map(function (t) { return Math.round(t * 100) / 100; }), label: "Quality baseline vs candidate", labelW: 130 }),
        h("div", { class: "legend", style: "margin-top:6px" }, [h("span", null, [h("i", { style: "background:var(--ref);border-radius:50%" }), "v1 baseline"]), h("span", null, [h("i", { style: "background:var(--good);border-radius:50%" }), "v2 within tolerance"]), h("span", null, [h("i", { style: "background:var(--critical);border-radius:50%" }), "v2 regressed"])])
      ]),
      panel("Regression rate by lane", "Share of cases that got worse. Quality may regress up to " + pct(th.regression_rate) + "; security, RBAC and trajectory 0%.", [
        stackedBars(rep.lanes.map(function (l) {
          return { label: LANE_NAME[l.lane] || l.lane, total: l.total, segs: [
            { value: l.total - l.regressed, cls: "f-pass", name: "held or improved" },
            { value: l.regressed, cls: "f-fail", name: "regressed" }
          ], note: pct(l.rate) + " (max " + pct(l.max_rate) + ")" };
        }), { label: "Regression rate by lane", unit: "cases", labelW: 110 })
      ])
    ]));

    var mt = h("tbody");
    rep.metrics.forEach(function (m) {
      mt.appendChild(h("tr", null, [h("td", { class: "strong", text: LANE_NAME[m.lane] || m.lane }), h("td", { text: m.metric.replace(/_/g, " ") }), h("td", { class: "num", text: fmt(m.baseline) }), h("td", { class: "num", text: fmt(m.candidate) }),
        h("td", { class: "num", text: (m.delta > 0 ? "+" : "") + fmt(m.delta) }), h("td", { class: "num", text: m.tolerance === null ? "report only" : m.tolerance === 0 ? "no change" : "≥ " + fmt(m.tolerance) }), h("td", null, [pill(m.status)])]));
    });
    out.push(panel("Baseline vs candidate", null, [h("div", { class: "tablewrap" }, [h("table", null, [h("thead", null, [h("tr", null, ["Lane", "Metric", "v1", "v2", "Change", "Tolerance", "Status"].map(function (x) { return h("th", { text: x }); }))]), mt])])]));

    var ft = h("tbody");
    rep.flipped_cases.forEach(function (f) {
      var improved = f.change.indexOf("improved") === 0;
      var tr = h("tr", { class: "click", tabindex: "0" }, [h("td", null, [pill(improved ? "pass" : "fail", improved ? "Improved" : "Regressed")]), h("td", { class: "strong", text: f.case_id }), h("td", { text: LANE_NAME[f.lane] || f.lane }), h("td", { class: "clip", text: f.title }), h("td", { class: "num", text: f.baseline + " → " + f.candidate })]);
      activate(tr, function () { go({ tab: f.lane === "adk" ? "agent" : f.lane, filter: "all", q: "", focus: f.case_id }); });
      ft.appendChild(tr);
    });
    out.push(panel("Cases that changed", "Click a case to open it in its lane.", [h("div", { class: "tablewrap" }, [h("table", null, [h("thead", null, [h("tr", null, ["Change", "Case", "Lane", "Title", "v1 → v2"].map(function (x) { return h("th", { text: x }); }))]), ft])])]));
    out.push(panel("Versions compared", null, [h("div", { class: "grid g2" }, ["baseline", "candidate"].map(function (k) {
      var v = rep[k];
      return h("div", null, [h("h2", { text: cap(k) + " · " + v.version, style: "font-size:13px;margin-bottom:6px" }), kv([["Commit", v.commit], ["Model", v.model], ["Prompt", v.prompt_version], ["Dataset", v.dataset_hash], ["Created", v.created_at]])]);
    }))]));
    return out;
  }

  /* =================================================================
     DRIFT
     ================================================================= */
  function viewDrift() {
    var rep = report("drift");
    if (!rep) return [notRun("drift", "Compares a reference window of 100 queries with a no-drift control window and a current window, using PSI, KL and JS. Alerts trigger a re-evaluation; drift never blocks a release.")];
    var tm = rep.topic_mix;
    var out = [sampleBanner(), laneHead("drift", [[String(rep.alerts.length), "signals alerting"], [String(rep.windows.current), "queries in current window"], [rep.signals.every(function (x) { return x.control_status !== "alert"; }) ? "quiet" : "noisy", "control window"]])];
    if (rep.alerts.length) out.push(h("div", { class: "callout warn" }, [h("b", { text: "▲ Drift detected. " }), rep.recommendation || ""]));
    out.push(panel("Query topic mix", "Share of queries per topic. Reference and control are two normal weeks; current is the week under review.", [
      groupedColumns(tm.topics, [
        { name: "Reference", cls: "f-s1", values: tm.reference },
        { name: "Control", cls: "f-s2", values: tm.control },
        { name: "Current", cls: "f-s3", values: tm.current }
      ], { unit: "%", label: "Query topic mix by window" }),
      h("div", { class: "legend", style: "margin-top:8px" }, [h("span", null, [h("i", { style: "background:var(--s1)" }), "Reference"]), h("span", null, [h("i", { style: "background:var(--s2)" }), "Control"]), h("span", null, [h("i", { style: "background:var(--s3)" }), "Current"])])
    ]));
    var tb = h("tbody");
    rep.signals.forEach(function (x) {
      function st(v) { return v === "alert" ? pill("warn", "Alert") : v === "moderate" ? pill("info", "Moderate") : pill("pass", "Stable"); }
      tb.appendChild(h("tr", null, [h("td", { text: cap(x.type) }), h("td", { class: "strong", text: x.feature }), h("td", { text: x.method }),
        h("td", { class: "num", text: fmt(x.control, 3) }), h("td", null, [st(x.control_status)]), h("td", { class: "num", text: fmt(x.current, 3) }), h("td", null, [st(x.status)]), h("td", { class: "num", text: (x.method === "Rate change" ? "+" : "≥ ") + fmt(x.threshold) })]));
    });
    out.push(panel("Drift signals", "Control must stay quiet; if it alerts, the thresholds are too jumpy.", [h("div", { class: "tablewrap" }, [h("table", null, [h("thead", null, [h("tr", null, ["Type", "Signal", "Method", "Control", "", "Current", "", "Alert at"].map(function (x) { return h("th", { text: x }); }))]), tb])]),
      h("p", { class: "meta", style: "margin-top:10px", text: "KL(reference‖current) " + fmt(rep.kl_reference_current, 3) + " (report only) · embedding centroid distance: control " + fmt(rep.embedding_centroid_distance.control) + ", current " + fmt(rep.embedding_centroid_distance.current) + "." })]));
    var extra = [];
    if (rep.uncovered_examples && rep.uncovered_examples.length) extra.push(h("div", null, [h("h2", { text: "Current queries the documents don't cover", style: "font-size:13px;margin:0 0 6px" }), h("ul", { style: "margin:0;padding-left:18px" }, rep.uncovered_examples.slice(0, 5).map(function (q) { return h("li", { text: q }); }))]));
    if (rep.skipped && rep.skipped.length) extra.push(h("div", null, [h("h2", { text: "Not computed in this run", style: "font-size:13px;margin:0 0 6px" }), h("ul", { style: "margin:0;padding-left:18px" }, rep.skipped.map(function (x) { return h("li", null, [h("b", { text: x.feature }), " (" + x.type + "): " + x.why]); }))]));
    (rep.limitations || []).forEach(function (t) { extra.push(h("p", { class: "limit", text: "Limitation: " + t })); });
    if (extra.length) out.push(panel("Coverage and gaps", null, [h("div", { class: "grid g2" }, extra.slice(0, 2))].concat(extra.slice(2))));
    return out;
  }

  /* =================================================================
     AUDIT
     ================================================================= */
  function viewAudit() {
    var rep = report("audit");
    if (!rep) return [notRun("audit", "Checks that every request writes one audit line with the required fields, that rejections are logged, and that no question or answer text is ever stored (BR-13).")];
    var all = cases("audit");
    return [sampleBanner(), laneHead("audit", [[rep.passed + " / " + rep.total_cases, "checks passed"]]), panel("Audit checks", null, [caseTable("audit", all, [
      ["ID", function (c) { return c.id; }, "strong"], ["Status", function (c) { return pill(c.status); }], ["Check", function (c) { return c.title; }]
    ], function (c) { openDrawer(c.id, pill(c.status), [["Check", h("div", { text: c.title })], ["Rules", ruleChips(c.rule_ids)]]); })])];
  }

  /* =================================================================
     BACKEND SMOKE
     ================================================================= */
  function viewBackend() {
    var rep = report("smoke");
    if (!rep) return [notRun("smoke", "Drives the real API, ADK runners, tools, index and audit log with a scripted model: no LLM calls.")];
    var all = cases("smoke"), t = rep.traffic;
    var fdClinical = ((t.chunks_by_role.front_desk || {}).clinical) || 0;
    var out = [sampleBanner(), laneHead("smoke", [[rep.passed + " / " + rep.total_cases, "checks passed"], [String(fdClinical), "clinical chunks to front desk"], [String(t.requests), "requests in run"]])];
    var roleRows = [["front_desk", "Front desk"], ["clinician", "Clinician"]].map(function (r) {
      var v = t.chunks_by_role[r[0]] || { public: 0, clinical: 0 };
      return { label: r[1], segs: [{ value: v.public, cls: "f-s1", name: "public policy" }, { value: v.clinical, cls: "f-s2", name: "clinical record" }], note: (v.public + v.clinical) + " (" + v.clinical + " clinical)" };
    });
    var order = ["Allowed", "Denied", "No match", "Referred", "Invalid", "Error"];
    var decRows = order.filter(function (k) { return t.by_decision[k]; }).map(function (k) { return { label: k, segs: [{ value: t.by_decision[k], cls: "f-s1", name: "requests" }] }; });
    out.push(h("div", { class: "grid g2" }, [
      panel("Chunks retrieved, by caller role", "Every chunk that reached the model, from the audit log.", [
        stackedBars(roleRows, { label: "Chunks by role", unit: "chunks", labelW: 100 }),
        h("div", { class: "legend", style: "margin-top:8px" }, [h("span", null, [h("i", { style: "background:var(--s1)" }), "Public policy"]), h("span", null, [h("i", { style: "background:var(--s2)" }), "Clinical record"])]),
        h("div", { class: "callout " + (fdClinical ? "fail" : "good"), style: "margin-top:10px", text: fdClinical ? "✕ Front desk received clinical chunks." : "✓ Front desk received 0 clinical chunks, even when the model searched for a patient." })
      ]),
      panel("Requests by decision", "All audited requests, including 401, 403 and 422 rejections.", [stackedBars(decRows, { label: "Requests by decision", unit: "requests", labelW: 100 })])
    ]));
    out.push(panel("Smoke checks", "The model is scripted, including calls a misbehaving model might make, so these test the server-side controls.", [caseTable("smoke", all, [
      ["Area", function (c) { return c.area; }, "strong"], ["Status", function (c) { return pill(c.status); }], ["Check", function (c) { return c.check; }], ["Rule", function (c) { return c.rule; }, "muted"]
    ], function (c) { openDrawer(c.check, pill(c.status), [["Area", h("div", { text: c.area })], ["Evidence", quote(c.evidence)], ["Rule", h("div", { text: c.rule })]]); })]));
    return out;
  }

  /* ---------- "About this evaluation" ---------- */
  function aboutPanel(tab) {
    var g = DATA.guide[tab];
    if (!g) return null;
    var key = "medidesk-about-" + tab, open = true;
    try { open = localStorage.getItem(key) !== "closed"; } catch (e) {}

    var rows = h("tbody");
    g.metrics.forEach(function (m) {
      var meaning = h("td", { class: "bands" });
      if (m.note) meaning.appendChild(h("div", { class: "band-note", text: m.note }));
      (m.bands || []).forEach(function (b) {
        meaning.appendChild(h("div", { class: "band" }, [h("span", { class: "dot " + (b[2] === "info" ? "missing" : b[2]), "aria-hidden": "true" }), h("b", { text: b[0] }), h("span", { text: b[1] })]));
      });
      rows.appendChild(h("tr", null, [h("td", { class: "strong", text: m.name }), h("td", { class: "num", text: m.range }), h("td", { class: "num", text: m.gate || "—" }), meaning]));
    });

    var det = h("details", { class: "panel about" }, [
      h("summary", null, [h("span", { class: "about-k", text: tab === "overview" ? "How to read this page" : "About this evaluation" }), h("span", { class: "about-g", text: g.grades })]),
      h("div", { class: "about-b" }, [
        h("p", { class: "about-how", text: g.how }),
        h("div", { class: "tablewrap" }, [h("table", { class: "about-t" }, [h("thead", null, [h("tr", null, ["Metric", "Range", "Threshold", "What the values mean"].map(function (x) { return h("th", { text: x }); }))]), rows])])
      ])
    ]);
    if (open) det.setAttribute("open", "");
    det.addEventListener("toggle", function () { try { localStorage.setItem(key, det.open ? "open" : "closed"); } catch (e) {} });
    return det;
  }

  /* ---------- render ---------- */
  var VIEWS = { overview: viewOverview, security: viewSecurity, rbac: viewRbac, agent: viewAgent, quality: viewQuality, regression: viewRegression, drift: viewDrift, audit: viewAudit, backend: viewBackend };
  function render() {
    renderChrome();
    var main = document.getElementById("main"); main.textContent = "";
    var tab = VIEWS[state.tab] ? state.tab : "overview";
    var nodes = VIEWS[tab]().filter(Boolean);
    // Lane tabs open with what the evaluation grades; the overview ends with it.
    var about = aboutPanel(tab);
    if (about && tab !== "overview") nodes.splice(nodes[0] && nodes[0].className === "sample-banner" ? 1 : 0, 0, about);
    else if (about) nodes.push(about);
    nodes.forEach(function (n) { main.appendChild(n); });
    if (state.focus) {
      var hl = main.querySelector("tr.hl");
      if (hl) hl.scrollIntoView({ block: "center" });
    }
  }

  readHash();
  render();
  window.addEventListener("hashchange", function () { readHash(); render(); });
  var resizeTimer = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (Math.abs(window.innerWidth - lastW) < 40) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { lastW = window.innerWidth; if (!document.getElementById("drawer")) render(); }, 150);
  });
})();
</script>
</body>
</html>
